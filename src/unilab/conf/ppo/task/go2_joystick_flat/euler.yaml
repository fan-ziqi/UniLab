# @package _global_
# The installed UniSim provider advances Euler's common native World.
# Each launch supplies env.euler_native_library_path explicitly.
defaults:
  - /task/go2_joystick_flat/base
  - _self_

training:
  task_name: Go2JoystickFlat
  sim_backend: euler
  no_play: true
  play_render_mode: none

env:
  euler_native_library_path: null

algo:
  num_envs: 64
  max_iterations: 2
  num_steps_per_env: 8
