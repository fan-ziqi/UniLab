# @package _global_
# Euler's real physics route for the existing Go2JoystickFlat manager task.
# The provider is discovered from UniSim's public ``unisim.backends`` group;
# this file never aliases Euler to another backend.  The authority command is
# intentionally null in source: each launch must name its reviewed Euler
# worker explicitly through ``env.euler_go2_worker_command=[...]``.
defaults:
  - /task/go2_joystick_flat/base
  - _self_

training:
  task_name: Go2JoystickFlat
  sim_backend: euler
  no_play: true
  play_render_mode: none

env:
  euler_go2_worker_command: null

algo:
  num_envs: 64
  max_iterations: 2
  num_steps_per_env: 8
  empirical_normalization: true
